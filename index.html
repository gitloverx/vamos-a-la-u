<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d9488">
    <title>Vamos a la U | Directorio V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { 
                brand: { 50:'#f0fdfa', 100:'#ccfbf1', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e', 900:'#134e4a' }
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] }
        }}}
    </script>
    <style>
        body { overflow-x: hidden !important; }
        /* Regla estricta para que nada se salga de la tarjeta */
        .card-universidad { display: flex; align-items: center; width: 100%; max-width: 100%; overflow: hidden; }
        .texto-universidad { flex: 1; min-width: 0; overflow: hidden; padding-right: 8px; }
        .texto-universidad h4, .texto-universidad p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col w-full">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 w-full shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black text-lg shadow-sm shrink-0">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <!-- PRUEBA VISUAL: Si no ves esto, es caché -->
                    <h1 class="font-black text-lg text-slate-900 leading-none">VAMOS A LA U <span class="text-xs text-rose-500 bg-rose-100 px-1 py-0.5 rounded">V3</span></h1>
                    <span id="active-view-label" class="text-[11px] text-brand-600 font-semibold uppercase tracking-wider block mt-1">Directorio</span>
                </div>
            </div>
            <button onclick="promptAdmin()" class="text-slate-400 font-bold text-sm bg-slate-100 px-3 py-2 rounded-lg"><i class="fa-solid fa-lock"></i></button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto p-3 space-y-4">
        
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 flex gap-3 items-center w-full">
            <div class="flex gap-3 items-center w-full bg-slate-50 rounded-xl px-4 py-3 border border-slate-200">
                <i class="fa-solid fa-magnifying-glass text-brand-500"></i>
                <input type="text" id="search-input" placeholder="Buscar carrera..." oninput="handleSearch(this.value)" class="w-full bg-transparent text-sm focus:outline-none font-medium text-slate-800">
                <button onclick="clearSearch()" class="text-slate-400 hidden" id="clear-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <div id="view-universidades" class="space-y-3 w-full">
            <h2 class="text-lg font-black text-slate-800">Universidades Públicas</h2>
            <div id="grid-universidades" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 w-full"></div>
        </div>

        <div id="view-carreras" class="hidden space-y-3 w-full">
            <h2 class="text-lg font-black text-slate-800" id="titulo-carreras">Resultados</h2>
            <div id="grid-carreras" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 w-full"></div>
        </div>

        <div id="view-admin" class="hidden space-y-3 w-full">
            <h2 class="text-lg font-black text-slate-800">Admin</h2>
            <button onclick="logoutAdmin()" class="bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl text-sm">Salir</button>
        </div>
    </main>

    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden overflow-y-auto">
        <div class="min-h-full flex items-center justify-center p-3">
            <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden">
                <div class="bg-brand-600 text-white p-5 relative">
                    <button onclick="closeModal('detail-modal')" class="absolute top-4 right-4 text-white bg-white/20 p-2 rounded-full"><i class="fa-solid fa-xmark"></i></button>
                    <h3 id="pd-name" class="font-black text-xl pr-10"></h3>
                    <p id="pd-university" class="text-sm opacity-90 mt-1"></p>
                </div>
                <div class="p-5 space-y-3" id="pd-body"></div>
            </div>
        </div>
    </div>

    <script>
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyAMq6WVeYB3EHVUGyGsrkVQEIRzVlo0ZZU",
            authDomain: "vamos-a-la-u.firebaseapp.com",
            projectId: "vamos-a-la-u",
            storageBucket: "vamos-a-la-u.firebasestorage.app",
            messagingSenderId: "845460110257",
            appId: "1:845460110257:web:b9c7f175a3cbfa885fdb90"
        };
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        let db, auth; let universities = []; let programs = []; let isAdmin = false;
        
        const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const formatCost = (c) => { return typeof c === 'number' ? '$' + c.toLocaleString('es-CO') : c; };

        async function initFirebase() {
            try {
                const app = initializeApp(window.FIREBASE_CONFIG); db = getFirestore(app); auth = getAuth(app);
                onAuthStateChanged(auth, (user) => { if (user) attachListeners(); }); await signInAnonymously(auth);
            } catch (e) { console.error(e); }
        }

        function attachListeners() {
            onSnapshot(collection(db, 'vamos_universities'), (snapshot) => { 
                universities = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); 
                universities.sort((a, b) => (a.name || '').localeCompare(b.name || '')); 
                refreshUI(); 
            });
            onSnapshot(collection(db, 'vamos_programs'), (snapshot) => { 
                programs = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); 
                refreshUI(); 
            });
        }

        window.promptAdmin = function() {
            if (isAdmin) { document.getElementById('view-universidades').classList.add('hidden'); document.getElementById('view-admin').classList.remove('hidden'); return; }
            const pass = prompt("Contraseña:");
            if (pass === "2026") { isAdmin = true; document.getElementById('view-universidades').classList.add('hidden'); document.getElementById('view-admin').classList.remove('hidden'); }
        };

        window.logoutAdmin = function() { isAdmin = false; document.getElementById('view-admin').classList.add('hidden'); document.getElementById('view-universidades').classList.remove('hidden'); };

        window.handleSearch = function(val) {
            const term = (val || '').toLowerCase().trim();
            document.getElementById('clear-btn').classList.toggle('hidden', !term);
            if (!term) { 
                document.getElementById('view-carreras').classList.add('hidden'); 
                document.getElementById('view-universidades').classList.remove('hidden'); 
                return; 
            }
            document.getElementById('view-universidades').classList.add('hidden');
            document.getElementById('view-carreras').classList.remove('hidden');
            
            const results = programs.filter(p => {
                const u = universities.find(x => x.id === p.universityId);
                return `${p.name} ${u ? u.name : ''}`.toLowerCase().includes(term);
            });
            
            document.getElementById('titulo-carreras').textContent = `Resultados: "${val}" (${results.length})`;
            
            document.getElementById('grid-carreras').innerHTML = results.map(p => {
                const u = universities.find(x => x.id === p.universityId);
                return `<div onclick="openDetail('${p.firebaseId}')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer card-universidad">
                    <div class="texto-universidad">
                        <h4 class="font-bold text-sm text-slate-900">${escapeHtml(p.name)}</h4>
                        <p class="text-[11px] text-slate-500 mt-1"><i class="fa-solid fa-building-columns mr-1 text-brand-500"></i>${escapeHtml(u ? u.name : '')}</p>
                        <p class="text-[10px] font-bold text-brand-600 mt-1">${escapeHtml(p.period)} · ${escapeHtml(formatCost(p.cost))}</p>
                    </div>
                </div>`;
            }).join('') || `<div class="col-span-full text-center py-10"><p class="text-slate-500 text-sm">No se encontraron carreras.</p></div>`;
        };

        window.clearSearch = function() { document.getElementById('search-input').value = ''; handleSearch(''); };

        function refreshUI() {
            // EL ARREGLO MAESTRO: Se elimina el texto y se usa un icono fijo. Imposible que se salga.
            document.getElementById('grid-universidades').innerHTML = universities.map(u => {
                const progCount = programs.filter(p => p.universityId === u.id).length;
                return `<div onclick="handleSearch('${escapeHtml(u.name)}')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer card-universidad hover:border-brand-500">
                    
                    <!-- Cuadro verde con ICONO FIJO (Ya no tiene texto) -->
                    <div class="w-12 h-12 bg-brand-50 rounded-lg flex items-center justify-center text-brand-600 shrink-0 mr-3">
                        <i class="fa-solid fa-building-columns text-xl"></i>
                    </div>

                    <!-- Texto limitado estrictamente -->
                    <div class="texto-universidad">
                        <h4 class="font-bold text-sm text-slate-900">${escapeHtml(u.name)}</h4>
                        <p class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(u.city)}</p>
                        <p class="text-[10px] font-bold text-brand-600 mt-1">${progCount} carreras</p>
                    </div>
                    
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs shrink-0"></i>
                </div>`;
            }).join('');
        }

        window.openDetail = function (fbId) {
            const p = programs.find(x => x.firebaseId === fbId); if (!p) return; const u = universities.find(x => x.id === p.universityId);
            document.getElementById('pd-name').textContent = p.name; document.getElementById('pd-university').textContent = u ? u.name : '';
            document.getElementById('pd-body').innerHTML = `
                <div class="bg-brand-50 p-4 rounded-xl border border-brand-100">
                    <p class="text-[10px] font-bold text-brand-700 uppercase">Costo</p>
                    <p class="text-lg font-black text-brand-700 mt-1">${escapeHtml(formatCost(p.cost))}</p>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl text-sm">
                    <p class="font-bold text-slate-800 mb-2">Fechas (${escapeHtml(p.period)})</p>
                    <p class="text-slate-600">Inicio: ${escapeHtml(p.inscriptionStart)}</p>
                    <p class="text-rose-600 font-bold mt-1">Fin: ${escapeHtml(p.inscriptionEnd)}</p>
                </div>
                <a href="${escapeHtml(u ? u.website : '#')}" target="_blank" class="block bg-brand-600 text-white text-center py-3 rounded-xl font-bold text-sm">Sitio Web Oficial</a>`;
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeModal = function (id) { document.getElementById(id).classList.add('hidden'); };
        initFirebase();
    </script>
</body>
</html>
