<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d9488">
    <title>Vamos a la U | Directorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { 
                brand: { 50:'#f0fdfa', 100:'#ccfbf1', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e', 900:'#134e4a' },
                accent: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' }
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] }
        }}}
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col w-full">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 w-full shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black text-lg shadow-sm shrink-0">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-black text-lg tracking-tight text-slate-900 leading-none truncate">VAMOS A LA U</h1>
                    <span id="active-view-label" class="text-[11px] text-brand-600 font-semibold uppercase tracking-wider block mt-1">Directorio</span>
                </div>
            </div>
            <button onclick="promptAdmin()" class="text-slate-400 hover:text-brand-600 font-bold text-sm flex items-center gap-2 shrink-0 bg-slate-100 px-3 py-2 rounded-lg transition">
                <i class="fa-solid fa-lock"></i> <span class="hidden sm:inline">Admin</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-4 space-y-5">
        
        <!-- BUSCADOR -->
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 items-center w-full">
            <div class="flex gap-3 items-center w-full bg-slate-50 rounded-xl px-4 py-3 border border-slate-200 min-w-0">
                <i class="fa-solid fa-magnifying-glass text-brand-500 shrink-0"></i>
                <input type="text" id="search-input" placeholder="Buscar carrera..." oninput="handleSearch(this.value)" class="w-full bg-transparent text-sm focus:outline-none font-medium text-slate-800 min-w-0">
                <button onclick="clearSearch()" class="text-slate-400 hover:text-brand-600 hidden shrink-0" id="clear-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider shrink-0 bg-slate-100 px-4 py-2 rounded-xl w-full sm:w-auto text-center">
                <span id="count-total" class="text-brand-600 text-base">0</span> carreras
            </div>
        </div>

        <!-- VISTA 1: UNIVERSIDADES -->
        <div id="view-universidades" class="space-y-4 w-full">
            <h2 class="text-lg font-black text-slate-800 px-1">Universidades Públicas</h2>
            <div id="grid-universidades" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full"></div>
        </div>

        <!-- VISTA 2: CARRERAS -->
        <div id="view-carreras" class="hidden space-y-4 w-full">
            <h2 class="text-lg font-black text-slate-800 px-1" id="titulo-carreras">Resultados</h2>
            <div id="grid-carreras" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full"></div>
        </div>

        <!-- VISTA 3: ADMIN -->
        <div id="view-admin" class="hidden space-y-4 w-full">
            <h2 class="text-lg font-black text-slate-800 px-1">Panel Admin</h2>
            <div class="grid grid-cols-2 gap-4 max-w-md">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 border-l-4 border-l-brand-500 shadow-sm">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Universidades</span>
                    <h3 id="stat-universities" class="text-2xl font-black text-slate-900 mt-1">0</h3>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 border-l-4 border-l-accent-500 shadow-sm">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Carreras</span>
                    <h3 id="stat-programs" class="text-2xl font-black text-slate-900 mt-1">0</h3>
                </div>
            </div>
            <button onclick="logoutAdmin()" class="bg-slate-200 hover:bg-rose-100 text-slate-700 hover:text-rose-700 font-bold py-2.5 px-6 rounded-xl text-sm transition">Cerrar Sesión</button>
        </div>
    </main>

    <!-- MODAL DETALLE -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden overflow-y-auto">
        <div class="min-h-full flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden">
                <div class="bg-brand-600 text-white p-6 relative">
                    <button onclick="closeModal('detail-modal')" class="absolute top-4 right-4 text-white/80 bg-white/20 p-2 rounded-full hover:bg-white/30"><i class="fa-solid fa-xmark"></i></button>
                    <h3 id="pd-name" class="font-black text-xl pr-10 leading-tight break-words"></h3>
                    <p id="pd-university" class="text-sm opacity-90 mt-2 font-medium break-words"></p>
                </div>
                <div class="p-5 space-y-4" id="pd-body"></div>
            </div>
        </div>
    </div>

    <script>
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyAMq6WVeYB3EHVUGyGsrkVQEIRzVlo0ZZU",
            authDomain: "vamos-a-la-u.firebaseapp.com",
            projectId: "vamos-a-la-u",
            storageBucket: "vamos-a-la-u.firebasestorage.app",
            messagingSenderId: "845460110257",
            appId: "1:845460110257:web:b9c7f175a3cbfa885fdb90"
        };
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        let db, auth; let universities = []; let programs = []; let isAdmin = false;
        
        const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const formatCost = (c) => { return typeof c === 'number' ? '$' + c.toLocaleString('es-CO') : c; };

        async function initFirebase() {
            try {
                const app = initializeApp(window.FIREBASE_CONFIG); db = getFirestore(app); auth = getAuth(app);
                onAuthStateChanged(auth, (user) => { if (user) attachListeners(); }); await signInAnonymously(auth);
            } catch (e) { console.error(e); }
        }

        function attachListeners() {
            onSnapshot(collection(db, 'vamos_universities'), (snapshot) => { 
                universities = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); 
                universities.sort((a, b) => (a.name || '').localeCompare(b.name || '')); 
                refreshUI(); 
            });
            onSnapshot(collection(db, 'vamos_programs'), (snapshot) => { 
                programs = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); 
                refreshUI(); 
            });
        }

        window.switchView = function (view) {
            ['universidades','carreras','admin'].forEach(v => { document.getElementById(`view-${v}`).classList.add('hidden'); });
            document.getElementById(`view-${view}`).classList.remove('hidden');
            if(view === 'admin') document.getElementById('active-view-label').textContent = 'Panel Admin';
            else if(view === 'carreras') document.getElementById('active-view-label').textContent = 'Buscador';
            else document.getElementById('active-view-label').textContent = 'Directorio';
            refreshUI();
        };

        window.promptAdmin = function() {
            if (isAdmin) { switchView('admin'); return; }
            const pass = prompt("Contraseña:");
            if (pass === "2026") { isAdmin = true; switchView('admin'); } else if (pass !== null) { alert("Incorrecta"); }
        };

        window.logoutAdmin = function() { isAdmin = false; switchView('universidades'); };

        window.handleSearch = function(val) {
            const term = (val || '').toLowerCase().trim();
            document.getElementById('clear-btn').classList.toggle('hidden', !term);
            if (!term) { switchView('universidades'); return; }
            switchView('carreras');
            
            const results = programs.filter(p => {
                const u = universities.find(x => x.id === p.universityId);
                return `${p.name} ${u ? u.name : ''}`.toLowerCase().includes(term);
            });
            
            document.getElementById('titulo-carreras').textContent = `Resultados: "${val}" (${results.length})`;
            
            document.getElementById('grid-carreras').innerHTML = results.map(p => {
                const u = universities.find(x => x.id === p.universityId);
                return `<div onclick="openDetail('${p.firebaseId}')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-brand-500 hover:shadow-md transition group flex flex-col justify-between min-w-0">
                    <div class="min-w-0">
                        <h4 class="font-bold text-sm text-slate-900 group-hover:text-brand-600 leading-tight truncate">${escapeHtml(p.name)}</h4>
                        <p class="text-[11px] text-slate-500 mt-1 truncate"><i class="fa-solid fa-building-columns mr-1 text-brand-500"></i>${escapeHtml(u ? u.name : '')}</p>
                    </div>
                    <div class="flex flex-wrap gap-2 mt-3">
                        <span class="bg-brand-50 text-brand-700 text-[10px] font-bold px-2 py-1 rounded-md border border-brand-100">${escapeHtml(p.period)}</span>
                        <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-1 rounded-md border border-slate-200 truncate">${escapeHtml(formatCost(p.cost))}</span>
                    </div>
                </div>`;
            }).join('') || `<div class="col-span-full text-center py-10"><i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i><p class="text-slate-500 text-sm">No se encontraron carreras.</p></div>`;
        };

        window.clearSearch = function() {
            document.getElementById('search-input').value = '';
            handleSearch('');
        };

        function refreshUI() {
            document.getElementById('stat-universities').textContent = universities.length;
            document.getElementById('stat-programs').textContent = programs.length;
            document.getElementById('count-total').textContent = programs.length;

            // AQUI ESTA EL ARREGLO: Se cambió el texto por un ICONO para que nunca se salga del cuadro.
            document.getElementById('grid-universidades').innerHTML = universities.map(u => {
                const progCount = programs.filter(p => p.universityId === u.id).length;
                return `<div onclick="searchUniversity('${escapeHtml(u.name)}')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-brand-500 hover:shadow-md transition group flex items-center gap-3 w-full min-w-0 overflow-hidden">
                    <!-- ICONO FIJO (Nunca se sale) -->
                    <div class="w-12 h-12 bg-brand-50 rounded-lg flex items-center justify-center text-brand-600 shrink-0 group-hover:bg-brand-600 group-hover:text-white transition">
                        <i class="fa-solid fa-building-columns text-xl"></i>
                    </div>
                    <!-- Texto estrictamente controlado -->
                    <div class="flex-1 min-w-0 pr-2">
                        <h4 class="font-bold text-sm text-slate-900 truncate">${escapeHtml(u.name)}</h4>
                        <p class="text-xs text-slate-500 truncate"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(u.city)}</p>
                        <p class="text-[10px] font-bold text-brand-600 mt-0.5">${progCount} carreras</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs shrink-0"></i>
                </div>`;
            }).join('');
        }

        window.searchUniversity = function(name) {
            document.getElementById('search-input').value = name;
            handleSearch(name);
        };

        window.openDetail = function (fbId) {
            const p = programs.find(x => x.firebaseId === fbId); if (!p) return; const u = universities.find(x => x.id === p.universityId);
            document.getElementById('pd-name').textContent = p.name; document.getElementById('pd-university').textContent = u ? u.name : '';
            document.getElementById('pd-body').innerHTML = `
                <div class="bg-brand-50 p-4 rounded-xl border border-brand-100">
                    <p class="text-[10px] font-bold text-brand-700 uppercase tracking-wider">Costo de Inscripción</p>
                    <p class="text-lg font-black text-brand-700 mt-1">${escapeHtml(formatCost(p.cost))}</p>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Fechas (${escapeHtml(p.period)})</p>
                    <div class="flex justify-between text-sm py-1 border-b border-slate-100"><span class="text-slate-500">Inicio</span><span class="font-bold text-slate-800">${escapeHtml(p.inscriptionStart)}</span></div>
                    <div class="flex justify-between text-sm py-1 mt-1"><span class="text-slate-500">Fin</span><span class="font-bold text-rose-600">${escapeHtml(p.inscriptionEnd)}</span></div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Requisitos</p>
                    <p class="text-xs text-slate-700">${escapeHtml(p.requirements || 'Consultar sitio web')}</p>
                </div>
                <a href="${escapeHtml(u ? u.website : '#')}" target="_blank" class="block bg-accent-600 hover:bg-accent-700 text-white text-center py-3 rounded-xl font-bold text-sm shadow-md transition">Visitar Sitio Oficial</a>`;
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeModal = function (id) { document.getElementById(id).classList.add('hidden'); };
        initFirebase();
    </script>
</body>
</html>
