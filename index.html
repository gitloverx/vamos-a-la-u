<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d9488">
    <title>Vamos a la U | Directorio Nacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { 
                brand: { 50:'#f0fdfa', 100:'#ccfbf1', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e', 900:'#134e4a' },
                accent: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' }
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] }
        }}}
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col pb-20">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm w-full">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black text-lg shadow-sm"><i class="fa-solid fa-graduation-cap"></i></div>
                <div>
                    <h1 class="font-black text-lg tracking-tight text-slate-900 leading-none">VAMOS A LA U</h1>
                    <span id="active-view-label" class="text-xs text-brand-600 font-semibold uppercase tracking-wider">Buscador de Pregrados</span>
                </div>
            </div>
            <button onclick="promptAdmin()" class="text-slate-400 hover:text-brand-600 font-bold text-sm flex items-center gap-2">
                <i class="fa-solid fa-lock"></i> <span class="hidden md:inline">Admin</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- BUSCADOR Y FILTROS -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center w-full">
            <div class="flex gap-3 items-center w-full md:w-2/3 bg-slate-50 rounded-xl px-4 py-3 border border-slate-200">
                <i class="fa-solid fa-magnifying-glass text-brand-500 text-lg"></i>
                <input type="text" id="search-input" placeholder="Buscar carrera (Ej: Medicina, Sistemas...)" oninput="handleSearch(this.value)" class="w-full bg-transparent text-base focus:outline-none font-medium text-slate-800">
                <button onclick="clearSearch()" class="text-slate-400 hover:text-brand-600 hidden" id="clear-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex gap-2 w-full md:w-1/3 justify-end">
                <span class="text-sm font-bold text-slate-400 uppercase tracking-wider">Total: <span id="count-total" class="text-brand-600 text-lg">0</span> carreras</span>
            </div>
        </div>

        <!-- VISTA 1: UNIVERSIDADES (Grid) -->
        <div id="view-universidades" class="space-y-4 w-full">
            <h2 class="text-xl font-black text-slate-800">Universidades Públicas</h2>
            <div id="grid-universidades" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>

        <!-- VISTA 2: CARRERAS (Grid) -->
        <div id="view-carreras" class="hidden space-y-4 w-full">
            <h2 class="text-xl font-black text-slate-800" id="titulo-carreras">Resultados de Búsqueda</h2>
            <div id="grid-carreras" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>

        <!-- VISTA 3: ADMIN -->
        <div id="view-admin" class="hidden space-y-4 w-full">
            <h2 class="text-xl font-black text-slate-800">Panel de Administración</h2>
            <div class="grid grid-cols-2 gap-4 max-w-lg">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 border-l-4 border-l-brand-500 shadow-sm">
                    <span class="text-xs uppercase font-bold text-slate-400">Universidades</span>
                    <h3 id="stat-universities" class="text-3xl font-black text-slate-900 mt-1">0</h3>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 border-l-4 border-l-accent-500 shadow-sm">
                    <span class="text-xs uppercase font-bold text-slate-400">Programas</span>
                    <h3 id="stat-programs" class="text-3xl font-black text-slate-900 mt-1">0</h3>
                </div>
            </div>
            <button onclick="logoutAdmin()" class="bg-slate-200 hover:bg-rose-100 text-slate-700 hover:text-rose-700 font-bold py-2.5 px-6 rounded-xl text-sm transition">Salir de Admin</button>
        </div>
    </main>

    <!-- MODAL DETALLE -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden overflow-y-auto">
        <div class="min-h-full flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden">
                <div class="bg-brand-600 text-white p-6 relative">
                    <button onclick="closeModal('detail-modal')" class="absolute top-4 right-4 text-white/80 bg-white/20 p-2 rounded-full hover:bg-white/30"><i class="fa-solid fa-xmark"></i></button>
                    <h3 id="pd-name" class="font-black text-2xl pr-10 leading-tight"></h3>
                    <p id="pd-university" class="text-sm opacity-90 mt-2 font-medium"></p>
                </div>
                <div class="p-6 space-y-4" id="pd-body"></div>
            </div>
        </div>
    </div>

    <script>
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyAMq6WVeYB3EHVUGyGsrkVQEIRzVlo0ZZU",
            authDomain: "vamos-a-la-u.firebaseapp.com",
            projectId: "vamos-a-la-u",
            storageBucket: "vamos-a-la-u.firebasestorage.app",
            messagingSenderId: "845460110257",
            appId: "1:845460110257:web:b9c7f175a3cbfa885fdb90"
        };
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        let db, auth; let universities = []; let programs = []; let isAdmin = false;
        
        const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        nst formatCOP = (n) => n;
        const formatDate = (iso) => { if (!iso) return 'No definida'; const [y,m,d] = String(iso).split('-'); return `${d}/${m}/${y}`; };

        async function initFirebase() {
            try {
                const app = initializeApp(window.FIREBASE_CONFIG); db = getFirestore(app); auth = getAuth(app);
                onAuthStateChanged(auth, (user) => { if (user) attachListeners(); }); await signInAnonymously(auth);
            } catch (e) { console.error(e); }
        }

        function attachListeners() {
            onSnapshot(collection(db, 'vamos_universities'), (snapshot) => { 
                universities = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); 
                universities.sort((a, b) => (a.name || '').localeCompare(b.name || '')); 
                refreshUI(); 
            });
            onSnapshot(collection(db, 'vamos_programs'), (snapshot) => { 
                programs = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); 
                refreshUI(); 
            });
        }

        window.switchView = function (view) {
            ['universidades','carreras','admin'].forEach(v => { document.getElementById(`view-${v}`).classList.add('hidden'); });
            document.getElementById(`view-${view}`).classList.remove('hidden');
            if(view === 'admin') document.getElementById('active-view-label').textContent = 'Panel Admin';
            else if(view === 'carreras') document.getElementById('active-view-label').textContent = 'Buscador de Pregrados';
            else document.getElementById('active-view-label').textContent = 'Directorio de Universidades';
            refreshUI();
        };

        window.promptAdmin = function() {
            if (isAdmin) { switchView('admin'); return; }
            const pass = prompt("Contraseña de administrador:");
            if (pass === "2026") { isAdmin = true; switchView('admin'); } else if (pass !== null) { alert("Incorrecta"); }
        };

        window.logoutAdmin = function() { isAdmin = false; switchView('universidades'); };

        window.handleSearch = function(val) {
            const term = (val || '').toLowerCase().trim();
            document.getElementById('clear-btn').classList.toggle('hidden', !term);
            if (!term) { switchView('universidades'); return; }
            switchView('carreras');
            
            const results = programs.filter(p => {
                const u = universities.find(x => x.id === p.universityId);
                return `${p.name} ${u ? u.name : ''}`.toLowerCase().includes(term);
            });
            
            document.getElementById('titulo-carreras').textContent = `Resultados: "${val}" (${results.length})`;
            
            document.getElementById('grid-carreras').innerHTML = results.map(p => {
                const u = universities.find(x => x.id === p.universityId);
                return `<div onclick="openDetail('${p.firebaseId}')" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-brand-500 hover:shadow-md transition group">
                    <h4 class="font-bold text-base text-slate-900 group-hover:text-brand-600 leading-tight">${escapeHtml(p.name)}</h4>
                    <p class="text-xs text-slate-500 mt-2 font-medium"><i class="fa-solid fa-building-columns mr-1 text-brand-500"></i>${escapeHtml(u ? u.name : '')}</p>
                    <div class="flex flex-wrap gap-2 mt-3">
                        <span class="bg-brand-50 text-brand-700 text-[10px] font-bold px-2 py-1 rounded-md border border-brand-100">${escapeHtml(p.period)}</span>
                        <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-1 rounded-md border border-slate-200">${formatCOP(p.cost)}</span>
                    </div>
                </div>`;
            }).join('') || `<div class="col-span-full text-center py-10"><i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i><p class="text-slate-500 font-medium">No se encontraron carreras con ese nombre.</p></div>`;
        };

        window.clearSearch = function() {
            document.getElementById('search-input').value = '';
            handleSearch('');
        };

        function refreshUI() {
            document.getElementById('stat-universities').textContent = universities.length;
            document.getElementById('stat-programs').textContent = programs.length;
            document.getElementById('count-total').textContent = programs.length;

            document.getElementById('grid-universidades').innerHTML = universities.map(u => {
                const progCount = programs.filter(p => p.universityId === u.id).length;
                return `<div onclick="searchUniversity('${escapeHtml(u.name)}')" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-brand-500 hover:shadow-md transition group">
                    <div class="flex flex-col gap-3">
                        <div class="w-12 h-12 bg-brand-50 rounded-xl flex items-center justify-center text-brand-600 font-black text-lg group-hover:bg-brand-600 group-hover:text-white transition">${escapeHtml(u.shortName || u.name.substring(0,2))}</div>
                        <div>
                            <h4 class="font-bold text-sm text-slate-900 leading-tight">${escapeHtml(u.name)}</h4>
                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(u.city)}</p>
                            <p class="text-[11px] font-bold text-brand-600 mt-2 bg-brand-50 inline-block px-2 py-0.5 rounded-full">${progCount} programas</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        window.searchUniversity = function(name) {
            document.getElementById('search-input').value = name;
            handleSearch(name);
        };

        window.openDetail = function (fbId) {
            const p = programs.find(x => x.firebaseId === fbId); if (!p) return; const u = universities.find(x => x.id === p.universityId);
            document.getElementById('pd-name').textContent = p.name; document.getElementById('pd-university').textContent = u ? u.name : '';
            document.getElementById('pd-body').innerHTML = `
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-brand-50 p-4 rounded-2xl border border-brand-100"><p class="text-[10px] font-bold text-brand-700 uppercase tracking-wider">Inscripción</p><p class="text-xl font-black text-brand-700 mt-1">${formatCOP(p.cost)}</p></div>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200"><p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Duración</p><p class="text-lg font-black text-slate-800 mt-1">${escapeHtml(p.duration||'—')}</p></div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-2xl">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-3"><i class="fa-solid fa-calendar mr-1"></i> Fechas (${escapeHtml(p.period)})</p>
                    <div class="flex justify-between text-sm py-1 border-b border-slate-100"><span class="text-slate-500">Inicio</span><span class="font-bold text-slate-800">${formatDate(p.inscriptionStart)}</span></div>
                    <div class="flex justify-between text-sm py-1 mt-1"><span class="text-slate-500">Fin</span><span class="font-bold text-rose-600">${formatDate(p.inscriptionEnd)}</span></div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-2xl">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1"><i class="fa-solid fa-clipboard-list mr-1"></i> Requisitos</p>
                    <p class="text-sm text-slate-700">${escapeHtml(p.requirements || 'Consultar sitio web oficial')}</p>
                </div>
                <a href="${escapeHtml(u ? u.website : '#')}" target="_blank" class="block bg-accent-600 hover:bg-accent-700 text-white text-center py-3 rounded-2xl font-bold text-sm shadow-md transition">Visitar Sitio Web Oficial</a>`;
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeModal = function (id) { document.getElementById(id).classList.add('hidden'); };
        initFirebase();
    </script>
</body>
</html>
