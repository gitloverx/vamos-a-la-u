<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d9488">
    <title>Vamos a la U | Buscador de Universidades Públicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { 
                brand: { 50:'#f0fdfa', 100:'#ccfbf1', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e', 900:'#134e4a' },
                accent: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' }
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] }
        }}}
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col pb-20 select-none">
    <div id="main-app" class="flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-brand-600 text-white w-8 h-8 rounded-xl flex items-center justify-center font-black text-sm shadow-sm"><i class="fa-solid fa-graduation-cap"></i></div>
                <div>
                    <h1 class="font-black text-xs tracking-tight text-slate-900 leading-none">VAMOS A LA U</h1>
                    <span id="active-view-label" class="text-[10px] text-brand-600 font-semibold uppercase tracking-wider">Buscador Público</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="sync-indicator" class="flex h-2 w-2 relative" title="Conectando..."><span class="relative inline-flex rounded-full h-2 w-2 bg-slate-400"></span></span>
            </div>
        </header>
        <main class="flex-1 max-w-md w-full mx-auto p-3 space-y-3">
            <div id="view-buscar" class="space-y-3">
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 flex gap-2 items-center">
                    <i class="fa-solid fa-magnifying-glass text-brand-500 pl-1 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Buscar carrera o programa..." oninput="onSearchInput(this.value)" class="w-full bg-transparent text-sm focus:outline-none font-medium placeholder:text-slate-400 text-slate-800">
                    <button onclick="clearSearch()" class="text-slate-400 hover:text-brand-600 px-2 text-xs"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider"><i class="fa-solid fa-filter mr-1 text-brand-500"></i> Filtros</span>
                        <button onclick="clearFilters()" class="text-[10px] text-accent-600 font-bold hover:text-accent-700">Limpiar</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="filter-area" onchange="onFilterChange()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-[11px] font-semibold text-slate-700 focus:outline-none focus:border-brand-500"><option value="">Área</option></select>
                        <select id="filter-level" onchange="onFilterChange()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-[11px] font-semibold text-slate-700 focus:outline-none focus:border-brand-500"><option value="">Nivel</option><option>Pregrado</option></select>
                        <select id="filter-dept" onchange="onFilterChange()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-[11px] font-semibold text-slate-700 focus:outline-none focus:border-brand-500"><option value="">Departamento</option></select>
                        <select id="filter-exam" onchange="onFilterChange()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-[11px] font-semibold text-slate-700 focus:outline-none focus:border-brand-500"><option value="">Examen</option><option>Prueba ICFES</option><option>Prueba específica</option><option>Entrevista</option></select>
                    </div>
                </div>
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Resultados</span>
                    <span id="results-count" class="text-[10px] text-accent-600 font-bold bg-accent-50 px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="search-results" class="space-y-3"></div>
            </div>
            <div id="view-admin" class="hidden space-y-3">
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-brand-500">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Universidades</span>
                        <h3 id="stat-universities" class="text-xl font-black text-slate-900 mt-1">0</h3>
                    </div>
                    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-accent-500">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Programas</span>
                        <h3 id="stat-programs" class="text-xl font-black text-slate-900 mt-1">0</h3>
                    </div>
                </div>
                <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Universidades Registradas</span>
                    <div id="admin-universities-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
                </div>
                <button onclick="logoutAdmin()" class="w-full bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-bold py-2.5 rounded-xl text-xs transition border border-slate-200"><i class="fa-solid fa-right-from-bracket mr-1"></i> Salir de Admin</button>
            </div>
        </main>
        <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2 px-3 flex justify-around items-center z-40 max-w-md mx-auto rounded-t-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <button onclick="switchView('buscar')" id="nav-btn-buscar" class="flex flex-col items-center gap-1 text-brand-600 transition w-1/2"><i class="fa-solid fa-magnifying-glass text-base"></i><span class="text-[10px] font-bold">Buscar</span></button>
            <button onclick="promptAdmin()" id="nav-btn-admin" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition w-1/2"><i class="fa-solid fa-lock text-base"></i><span class="text-[10px] font-bold">Admin</span></button>
        </nav>
    </div>
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden overflow-y-auto">
        <div class="min-h-full flex items-start justify-center p-3 py-6">
            <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden">
                <div class="bg-gradient-to-r from-brand-600 to-brand-700 text-white p-5">
                    <div class="flex justify-between items-start gap-2">
                        <div class="min-w-0"><h3 id="pd-name" class="font-black text-xl leading-tight"></h3><p id="pd-university" class="text-[12px] opacity-90 mt-1 font-medium"></p></div>
                        <button onclick="closeModal('detail-modal')" class="text-white/80 hover:text-white bg-white/20 p-2 rounded-full shrink-0"><i class="fa-solid fa-xmark text-sm"></i></button>
                    </div>
                </div>
                <div class="p-5 space-y-4" id="pd-body"></div>
            </div>
        </div>
    </div>
    <script>
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyAMq6WVeYB3EHVUGyGsrkVQEIRzVlo0ZZU",
            authDomain: "vamos-a-la-u.firebaseapp.com",
            projectId: "vamos-a-la-u",
            storageBucket: "vamos-a-la-u.firebasestorage.app",
            messagingSenderId: "845460110257",
            appId: "1:845460110257:web:b9c7f175a3cbfa885fdb90"
        };
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        let db, auth; let universities = []; let programs = []; let isAdmin = false;
        let searchTerm = ''; let filters = { area:'', level:'', dept:'', exam:'' };
        function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function formatCOP(n) { return '$' + (Number(n) || 0).toLocaleString('es-CO'); }
        function formatDate(iso) { if (!iso) return 'No definida'; const [y,m,d] = String(iso).split('-'); if (!y || !m || !d) return iso; return `${d}/${m}/${y}`; }
        function setSyncStatus(state) {
            const el = document.getElementById('sync-indicator');
            const map = { ok: ['bg-emerald-500', 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75', 'Conectado'], loading: ['bg-amber-400', 'animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-300 opacity-75', 'Conectando...'], error: ['bg-rose-500', 'absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-40', 'Sin conexión'] };
            const [dot, ping, title] = map[state] || map.loading; el.title = title;
            el.innerHTML = `<span class="${ping}"></span><span class="relative inline-flex rounded-full h-2 w-2 ${dot}"></span>`;
        }
        async function initFirebase() {
            setSyncStatus('loading');
            try {
                const app = initializeApp(window.FIREBASE_CONFIG); db = getFirestore(app); auth = getAuth(app);
                onAuthStateChanged(auth, (user) => { if (user) attachListeners(); }); await signInAnonymously(auth);
            } catch (e) { console.error("Firebase init error:", e); setSyncStatus('error'); }
        }
        function attachListeners() {
            onSnapshot(collection(db, 'vamos_universities'), (snapshot) => { universities = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); universities.sort((a, b) => (a.name || '').localeCompare(b.name || '')); setSyncStatus('ok'); refreshAll(); });
            onSnapshot(collection(db, 'vamos_programs'), (snapshot) => { programs = snapshot.docs.map(d => ({ firebaseId: d.id, ...d.data() })); programs.sort((a, b) => (a.name || '').localeCompare(b.name || '')); refreshAll(); });
        }
        window.switchView = function (view) {
            ['buscar','admin'].forEach(v => { document.getElementById(`view-${v}`).classList.add('hidden'); document.getElementById(`nav-btn-${v}`).className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition w-1/2"; });
            document.getElementById(`view-${view}`).classList.remove('hidden');
            if(view==='admin') { document.getElementById(`nav-btn-${view}`).className = "flex flex-col items-center gap-1 text-accent-600 transition w-1/2"; document.getElementById('active-view-label').textContent = "Panel de Administrador"; }
            else { document.getElementById(`nav-btn-${view}`).className = "flex flex-col items-center gap-1 text-brand-600 transition w-1/2"; document.getElementById('active-view-label').textContent = "Buscador Público"; }
            refreshAll();
        };
        window.promptAdmin = function() { if (isAdmin) { switchView('admin'); return; } const pass = prompt("Ingrese la contraseña de administrador:"); if (pass === "2026") { isAdmin = true; switchView('admin'); } else if (pass !== null) { alert("Contraseña incorrecta."); } };
        window.logoutAdmin = function() { isAdmin = false; switchView('buscar'); };
        function refreshAll() { if (!document.getElementById('view-buscar').classList.contains('hidden')) renderBuscar(); if (!document.getElementById('view-admin').classList.contains('hidden')) renderAdmin(); }
        window.onSearchInput = function (v) { searchTerm = v || ''; renderBuscar(); };
        window.onFilterChange = function () { filters.area = document.getElementById('filter-area').value; filters.level = document.getElementById('filter-level').value; filters.dept = document.getElementById('filter-dept').value; filters.exam = document.getElementById('filter-exam').value; renderBuscar(); };
        window.clearSearch = function () { searchTerm = ''; document.getElementById('search-input').value = ''; renderBuscar(); };
        window.clearFilters = function () { filters = { area:'', level:'', dept:'', exam:'' }; ['area','level','dept','exam'].forEach(f => document.getElementById('filter-' + f).value = ''); renderBuscar(); };
        function populateFilterOptions() {
            const areaSel = document.getElementById('filter-area'); const deptSel = document.getElementById('filter-dept');
            const areas = [...new Set(programs.map(p => p.area).filter(Boolean))].sort(); const depts = [...new Set(universities.map(u => u.department).filter(Boolean))].sort();
            const ca = areaSel.value, cd = deptSel.value; areaSel.innerHTML = '<option value="">Área</option>' + areas.map(a => `<option>${escapeHtml(a)}</option>`).join(''); deptSel.innerHTML = '<option value="">Departamento</option>' + depts.map(d => `<option>${escapeHtml(d)}</option>`).join('');
            areaSel.value = ca || ''; deptSel.value = cd || '';
        }
        function renderBuscar() {
            populateFilterOptions(); const container = document.getElementById('search-results'); const countEl = document.getElementById('results-count');
            const term = (searchTerm || '').toLowerCase().trim();
            const results = programs.filter(p => {
                if (term) { const u = universities.find(x => x.id === p.universityId); const hay = `${p.name||''} ${p.area||''} ${u ? u.name : ''}`.toLowerCase(); if (!hay.includes(term)) return false; }
                if (filters.area && p.area !== filters.area) return false; if (filters.level && p.level !== filters.level) return false; if (filters.exam && p.examType !== filters.exam) return false;
                if (filters.dept) { const u = universities.find(x => x.id === p.universityId); if (!u || u.department !== filters.dept) return false; }
                return true;
            });
            countEl.textContent = results.length;
            if (results.length === 0) { container.innerHTML = `<div class="bg-white rounded-2xl p-8 border border-slate-200 text-center shadow-sm"><div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-book-open text-slate-300 text-2xl"></i></div><p class="text-slate-700 text-sm font-bold">No se encontraron resultados</p><p class="text-[11px] text-slate-400 mt-1">Intenta con otra palabra o limpia los filtros.</p></div>`; return; }
            container.innerHTML = results.map(p => {
                const u = universities.find(x => x.id === p.universityId);
                return `<div onclick="openDetail('${p.firebaseId}')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm active:scale-[0.98] transition cursor-pointer hover:border-brand-300 group"><div class="flex justify-between items-start gap-3"><div class="min-w-0 flex-1"><h4 class="font-bold text-sm text-slate-900 group-hover:text-brand-700 transition">${escapeHtml(p.name)}</h4><p class="text-[11px] text-slate-500 mt-0.5 line-clamp-1"><i class="fa-solid fa-building-columns mr-1"></i> ${escapeHtml(u ? u.name : 'Universidad')}</p><div class="flex flex-wrap gap-1.5 mt-2"><span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-brand-50 text-brand-700 border border-brand-100">${escapeHtml(p.area||'')}</span><span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 border border-slate-200">${escapeHtml(p.level||'')}</span>${u ? `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-accent-50 text-accent-700 border border-accent-100">${escapeHtml(u.city||'')}</span>` : ''}</div></div><div class="text-right shrink-0 bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Inscripción</span><p class="text-[12px] font-black text-brand-600">${formatCOP(p.cost)}</p></div></div></div>`;
            }).join('');
        }
        window.openDetail = function (fbId) {
            const p = programs.find(x => x.firebaseId === fbId); if (!p) return; const u = universities.find(x => x.id === p.universityId);
            document.getElementById('pd-name').textContent = p.name || 'Programa'; document.getElementById('pd-university').textContent = u ? u.name : 'Universidad';
            document.getElementById('pd-body').innerHTML = `<div class="grid grid-cols-2 gap-3"><div class="bg-brand-50 border border-brand-100 rounded-2xl p-3"><p class="text-[10px] uppercase font-bold text-brand-700 tracking-wider">Costo Inscripción</p><p class="text-lg font-black text-brand-700 mt-0.5">${formatCOP(p.cost)}</p></div><div class="bg-slate-50 border border-slate-100 rounded-2xl p-3"><p class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Duración</p><p class="text-lg font-black text-slate-800 mt-0.5">${escapeHtml(p.duration||'—')}</p></div></div><div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-3"><p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-calendar-days text-brand-500"></i> Periodo ${escapeHtml(p.period)}</p><div class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-xs text-slate-500">Inicio</span><span class="font-bold text-slate-800 text-sm">${formatDate(p.inscriptionStart)}</span></div><div class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-xs text-slate-500">Fin</span><span class="font-bold text-rose-600 text-sm">${formatDate(p.inscriptionEnd)}</span></div></div><div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-1"><p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1 mb-1"><i class="fa-solid fa-clipboard-list text-brand-500"></i> Requisitos</p><p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(p.requirements || 'No registrados')}</p></div><div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-1"><p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1 mb-1"><i class="fa-solid fa-file-pen text-brand-500"></i> Examen de Admisión</p><p class="text-sm font-bold text-slate-800">${escapeHtml(p.examType || 'No especificado')}</p></div>${u && u.website ? `<a href="${escapeHtml(u.website)}" target="_blank" rel="noopener" class="block bg-accent-600 hover:bg-accent-700 text-white text-sm font-bold py-3 rounded-2xl text-center transition shadow-md shadow-accent-600/20"><i class="fa-solid fa-globe mr-2"></i> Visitar Sitio Web Oficial</a>` : ''}`;
            document.getElementById('detail-modal').classList.remove('hidden');
        };
        function renderAdmin() {
            document.getElementById('stat-universities').textContent = universities.length; document.getElementById('stat-programs').textContent = programs.length;
            document.getElementById('admin-universities-list').innerHTML = universities.map(u => `<div class="bg-slate-50 p-3 rounded-xl text-xs border border-slate-100 flex justify-between items-center gap-2"><div class="min-w-0"><p class="font-bold text-slate-800 truncate">${escapeHtml(u.name)}</p><p class="text-[10px] text-slate-500 truncate">${escapeHtml(u.city||'')} · ${escapeHtml(u.department||'')}</p></div><span class="bg-brand-100 text-brand-700 text-[10px] font-bold px-2 py-1 rounded-lg">ID: ${u.id}</span></div>`).join('');
        }
        window.closeModal = function (id) { document.getElementById(id).classList.add('hidden'); };
        initFirebase();
    </script>
</body>
</html>
